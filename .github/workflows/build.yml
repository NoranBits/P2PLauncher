name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version tagging
        
    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Verify .NET installation
      run: |
        dotnet --info
        dotnet --list-sdks
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore P2PLauncher.sln --verbosity minimal
      
    - name: Build solution
      run: |
        .\scripts\build.ps1 -Target all -Configuration Release -Clean
      shell: pwsh
      
    - name: Run tests
      run: dotnet test P2PLauncher.sln --no-build --configuration Release --verbosity minimal --logger trx --results-directory TestResults
      continue-on-error: false
      
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx
        
    - name: Publish artifacts
      run: |
        .\scripts\publish.ps1 -Target all -Configuration Release -SelfContained -Runtime win-x64
      shell: pwsh
      
    - name: Upload client artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: P2PLauncher-Client-${{ github.run_number }}
        path: |
          artifacts/client/*.zip
        retention-days: 30
        
    - name: Upload server artifacts  
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: P2PLauncher-Server-${{ github.run_number }}
        path: |
          artifacts/server/*.zip
        retention-days: 30
        
    - name: Upload standalone artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: P2PLauncher-Standalone-${{ github.run_number }}
        path: |
          artifacts/standalone/*.zip
        retention-days: 30
        
    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **.NET Version**: ${{ env.DOTNET_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if (Test-Path "artifacts") {
          echo "### Artifacts Created" >> $GITHUB_STEP_SUMMARY
          Get-ChildItem -Path "artifacts" -Recurse -Filter "*.zip" | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            echo "- **$($_.Name)** ($size MB)" >> $GITHUB_STEP_SUMMARY
          }
        } else {
          echo "### ⚠️ No artifacts were created" >> $GITHUB_STEP_SUMMARY
        }
      shell: pwsh